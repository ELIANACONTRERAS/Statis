# Construye los instaladores de NekaStat (carpeta NekaStat/) para Windows y macOS.
# Se ejecuta al subir cambios en NekaStat/ o a mano desde la pestaña "Actions".
name: NekaStat - construir instaladores
on:
  workflow_dispatch:
  push:
    paths: ['NekaStat/**', '.github/workflows/nekastat_instaladores.yml']
defaults:
  run:
    working-directory: NekaStat
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Dependencias
        run: pip install -r requirements.txt pyinstaller
      - name: Compilar
        run: pyinstaller instalador/NekaStat.spec --noconfirm
      - name: Instalador (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" instalador\windows\NekaStat_instalador.iss
      - uses: actions/upload-artifact@v4
        with:
          name: NekaStat-Windows
          path: NekaStat/instalador/windows/salida/*.exe
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest   # Apple Silicon (M1, M2, M3, M4)
            arch: AppleSilicon
          - runner: macos-13       # Intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Construir .app, .pkg y .dmg
        run: bash instalador/macos/construir_macos.sh
      - name: Renombrar según arquitectura
        run: |
          cd instalador/macos/salida
          mv NekaStat_v3.8_Instalador_Mac.pkg NekaStat_v3.8_Instalador_Mac_${{ matrix.arch }}.pkg
          mv NekaStat_v3.8_Mac.dmg NekaStat_v3.8_Mac_${{ matrix.arch }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: NekaStat-Mac-${{ matrix.arch }}
          path: NekaStat/instalador/macos/salida/*
